[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiorisk"
version = "1.0.0"
description = "Heart disease risk classifier with an end-to-end MLOps toolchain (BITS WILP MLOps Assignment 1)"
authors = [{ name = "Shankaraguru Ramdurg (2025AE05523)" }]
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cardiorisk.serving" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
