apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
    app.kubernetes.io/name: heart-risk-api
    app.kubernetes.io/component: model-server
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # zero-downtime model rollouts
      maxSurge: 1
  selector:
    matchLabels:
      app: heart-risk-api
  template:
    metadata:
      labels:
        app: heart-risk-api
        app.kubernetes.io/name: heart-risk-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          # Local clusters (kind/minikube/Docker Desktop): build or `kind load` the image.
          # Cloud (GKE/EKS/AKS): use ghcr.io/<github-user>/heart-risk-api:<sha> pushed by CI.
          image: heart-risk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: heart-risk-api-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # give the ingress/endpoints controller time to stop routing to this pod
              # before uvicorn shuts down (avoids 502s during rolling updates)
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
