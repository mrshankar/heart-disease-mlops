apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kubectl apply -k k8s/monitoring
# (alert_rules.yml and heart-risk-api.json are copies of monitoring/ - `make sync-monitoring`)
namespace: heart-risk
resources:
  - prometheus.yaml
  - grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - alert_rules.yml
  - name: grafana-dashboards
    files:
      - heart-risk-api.json
