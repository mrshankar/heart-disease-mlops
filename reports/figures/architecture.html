<text x="30" y="40" font-size="24" font-weight="700" fill="#0f172a">Heart Disease Risk - MLOps architecture</text>
<text x="30" y="64" font-size="13" fill="#475569">UCI data -> tracked training -> packaged model -> container -> Kubernetes, monitored with Prometheus / Grafana; automated by GitHub Actions; reproducible in Prayogshala (Kubeflow)</text>

<!-- lanes -->
<rect class="lane" x="20" y="85" width="1560" height="235"/><text class="lt" x="38" y="110">EXPERIMENTATION &amp; TRAINING</text>
<rect class="lane" x="20" y="335" width="1560" height="255"/><text class="lt" x="38" y="360">SERVING &amp; OPERATIONS</text>
<rect class="lane" x="20" y="605" width="1560" height="275"/><text class="lt" x="38" y="630">AUTOMATION (CI/CD)  &amp;  PRAYOGSHALA</text>

<!-- training lane -->
<rect class="b" x="40" y="130" width="190" height="80" fill="#e0f2fe" stroke="#0284c7"/>
<text class="t" x="55" y="155">UCI repository</text><text class="s" x="55" y="175">4 hospitals, 920 rows</text><text class="s" x="55" y="192">download_data.py + SHA-256</text>

<rect class="b" x="270" y="130" width="200" height="80" fill="#e0f2fe" stroke="#0284c7"/>
<text class="t" x="285" y="155">Clean + EDA</text><text class="s" x="285" y="175">sentinels -> NaN, binary target</text><text class="s" x="285" y="192">7 figures, missingness by site</text>

<rect class="b" x="500" y="120" width="345" height="100" fill="#ede9fe" stroke="#7c3aed"/>
<text class="t" x="515" y="145">sklearn Pipeline + GridSearchCV</text><text class="s" x="515" y="165">ClinicalFeatures -> impute -> RobustScaler / one-hot</text>
<text class="s" x="515" y="182">LogReg | RandomForest | HistGradBoost (72 configs)</text><text class="s" x="515" y="199">5-fold stratified CV, ROC-AUC selection, F2 threshold</text>

<rect class="b" x="880" y="120" width="330" height="100" fill="#fef3c7" stroke="#d97706"/>
<text class="t" x="895" y="145">MLflow</text><text class="s" x="895" y="165">tracking: params, CV/test metrics, plots</text>
<text class="s" x="895" y="182">78 runs (pipeline > model > grid candidates)</text><text class="s" x="895" y="199">Model Registry: heart-disease-classifier@champion</text>

<rect class="b" x="1245" y="120" width="315" height="100" fill="#dcfce7" stroke="#16a34a"/>
<text class="t" x="1260" y="145">Packaged model</text><text class="s" x="1260" y="165">models/model.joblib (pre-processing + LR)</text>
<text class="s" x="1260" y="182">model_metadata.json: version, threshold, metrics</text><text class="s" x="1260" y="199">MLflow pyfunc flavour with code_paths</text>

<path class="e" d="M230,170 L268,170"/><path class="e" d="M470,170 L498,170"/><path class="e" d="M845,170 L878,170"/><path class="e" d="M1210,170 L1243,170"/>
<text class="el" x="1050" y="252">log_model + register</text>
<path class="d" d="M700,220 C700,262 1040,262 1040,222"/>

<!-- serving lane -->
<rect class="b" x="1240" y="380" width="320" height="95" fill="#dcfce7" stroke="#16a34a"/>
<text class="t" x="1255" y="405">Docker image  heart-risk-api</text><text class="s" x="1255" y="425">multi-stage, slim, non-root (uid 10001)</text>
<text class="s" x="1255" y="442">FastAPI + uvicorn, HEALTHCHECK</text><text class="s" x="1255" y="459">pushed to GHCR by CI (tag = git sha)</text>
<path class="e" d="M1385,220 L1385,378"/><text class="el" x="1395" y="300">COPY into image</text>

<rect class="b" x="560" y="375" width="620" height="200" fill="#fff" stroke="#2563eb" stroke-dasharray="6 4"/>
<text class="t" x="575" y="398" fill="#1d4ed8">Kubernetes  (namespace heart-risk)</text>
<rect class="b" x="580" y="412" width="185" height="70" fill="#dbeafe" stroke="#2563eb"/><text class="t" x="592" y="435">Ingress</text><text class="s" x="592" y="453">heart-risk.local</text><text class="s" x="592" y="469">nginx / traefik</text>
<rect class="b" x="785" y="412" width="170" height="70" fill="#dbeafe" stroke="#2563eb"/><text class="t" x="797" y="435">Service</text><text class="s" x="797" y="453">LoadBalancer :80</text><text class="s" x="797" y="469">-> pods :8000</text>
<rect class="b" x="975" y="405" width="190" height="85" fill="#dbeafe" stroke="#2563eb"/><text class="t" x="987" y="428">Deployment</text><text class="s" x="987" y="446">2-6 pods (HPA @70% CPU)</text><text class="s" x="987" y="462">probes, PDB, preStop drain</text><text class="s" x="987" y="478">rolling update maxUnavail 0</text>
<path class="e" d="M765,447 L783,447"/><path class="e" d="M955,447 L973,447"/>
<path class="e" d="M1240,430 L1167,440"/><text class="el" x="1172" y="420">image</text>

<rect class="b" x="580" y="500" width="290" height="62" fill="#fee2e2" stroke="#dc2626"/><text class="t" x="592" y="523">Prometheus</text><text class="s" x="592" y="541">pod discovery (RBAC), 5s scrape, 5 alert rules</text>
<rect class="b" x="895" y="500" width="270" height="62" fill="#fee2e2" stroke="#dc2626"/><text class="t" x="907" y="523">Grafana dashboard</text><text class="s" x="907" y="541">traffic, p95 latency, drift, missing inputs</text>
<path class="e" d="M1070,490 L800,500"/><text class="el" x="905" y="490">/metrics</text>
<path class="e" d="M870,531 L893,531"/>

<rect class="b" x="40" y="390" width="210" height="80" fill="#f1f5f9" stroke="#64748b"/><text class="t" x="55" y="415">Clients</text><text class="s" x="55" y="435">POST /predict, /predict/batch</text><text class="s" x="55" y="452">JSON in -> class + confidence</text>
<rect class="b" x="290" y="390" width="230" height="80" fill="#f1f5f9" stroke="#64748b"/><text class="t" x="305" y="415">API contract</text><text class="s" x="305" y="435">pydantic validation (422)</text><text class="s" x="305" y="452">/health /ready /model-info</text>
<path class="e" d="M250,430 L288,430"/><path class="e" d="M520,435 L578,442"/>
<rect class="b" x="40" y="495" width="480" height="70" fill="#f1f5f9" stroke="#64748b"/><text class="t" x="55" y="520">Logging &amp; live monitor</text><text class="s" x="55" y="540">structured JSON logs with request_id + latency;  /monitoring HTML dashboard</text>

<!-- automation lane -->
<text class="t" x="40" y="660">GitHub Actions  (.github/workflows/ci-cd.yml) - every job uploads logs / reports as artifacts</text>
<g>
<rect class="b" x="40"  y="675" width="150" height="70" fill="#f3e8ff" stroke="#9333ea"/><text class="t" x="55" y="700">lint</text><text class="s" x="55" y="720">flake8</text>
<rect class="b" x="215" y="675" width="170" height="70" fill="#f3e8ff" stroke="#9333ea"/><text class="t" x="230" y="700">test</text><text class="s" x="230" y="720">50 pytest, coverage,</text><text class="s" x="230" y="736">checksum verify</text>
<rect class="b" x="410" y="675" width="200" height="70" fill="#f3e8ff" stroke="#9333ea"/><text class="t" x="425" y="700">train</text><text class="s" x="425" y="720">EDA + MLflow training</text><text class="s" x="425" y="736">gate: test ROC-AUC &gt;= 0.85</text>
<rect class="b" x="635" y="675" width="215" height="70" fill="#f3e8ff" stroke="#9333ea"/><text class="t" x="650" y="700">docker</text><text class="s" x="650" y="720">build, run, smoke-test</text><text class="s" x="650" y="736">/predict, push GHCR</text>
<rect class="b" x="875" y="675" width="215" height="70" fill="#f3e8ff" stroke="#9333ea"/><text class="t" x="890" y="700">deploy-kind</text><text class="s" x="890" y="720">kind cluster, apply -k,</text><text class="s" x="890" y="736">rollout + endpoint checks</text>
<path class="e" d="M190,710 L213,710"/><path class="e" d="M385,710 L408,710"/><path class="e" d="M610,710 L633,710"/><path class="e" d="M850,710 L873,710"/>
<text class="el" x="40" y="768">any failing step stops the pipeline (set -o pipefail, quality gate, smoke assertions, rollout timeout)</text>
</g>

<rect class="b" x="1130" y="650" width="430" height="210" fill="#ecfeff" stroke="#0891b2"/>
<text class="t" x="1145" y="675">BITS Prayogshala (Kubeflow)</text>
<text class="s" x="1145" y="698">notebooks/00_prayogshala_end_to_end.ipynb</text>
<text class="s" x="1160" y="716">clean pip install -> lint + tests -> EDA -> train (MLflow)</text>
<text class="s" x="1160" y="733">-> serve API in-notebook -> /predict, load test, /metrics</text>
<text class="s" x="1145" y="760">kubeflow/pipeline.py  (KFP v2)</text>
<text class="s" x="1160" y="778">fetch-and-test -> train-and-track -> quality-gate</text>
<text class="s" x="1160" y="795">-> publish-model (conditional)</text>
<text class="s" x="1145" y="822">same src/cardiorisk code as CI, Docker and Kubernetes</text>

<path class="d" d="M980,675 C980,640 1000,600 1060,577"/>
<path class="d" d="M540,675 V222"/><text class="el" x="548" y="625">re-train on every push</text>
