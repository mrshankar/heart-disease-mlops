# Prometheus config for docker-compose (local) - scrapes the API container.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert_rules.yml
scrape_configs:
  - job_name: heart-risk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          env: local
